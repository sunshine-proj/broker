name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      db:
        image: timescale/timescaledb:2.32.0-pg17
        env:
          POSTGRES_DB: marketdata
          POSTGRES_USER: marketdata
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketdata -d marketdata"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: marketdata
      POSTGRES_USER: marketdata
      POSTGRES_PASSWORD: ci_only_password
      # Integration tests must run here, not be skipped.
      REQUIRE_DATABASE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Lint, format check and tests
        run: scripts/check.sh
