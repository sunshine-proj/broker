# Dashboards are generated by scripts/build_dashboards.py into grafana/dashboards/
# and loaded from there. Changes made in the Grafana interface are not kept.
apiVersion: 1

providers:
  - name: Market Data
    folder: Market Data
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana-dashboards
