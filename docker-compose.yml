name: market-data-platform

# The base stack. It publishes no ports: in development,
# docker-compose.override.yml (loaded automatically) publishes them on
# BIND_ADDRESS; in production, docker-compose.prod.yml adds the HTTPS reverse
# proxy, the only way in. See docs/deployment.md.
#
# Networks: `internal` has no route to the outside world. The database and
# Prometheus are only on it. Services that must reach the internet (providers,
# alert notifications) are also on `egress`.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Hardening shared by the services that allow it.
x-hardened: &hardened
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

# Environment shared by the services that run backend code.
x-backend-environment: &backend-environment
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
  POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  # Provider credentials. Optional: a provider without its key reports itself as down.
  TWELVEDATA_API_KEY: ${TWELVEDATA_API_KEY:-}
  COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
  FRED_API_KEY: ${FRED_API_KEY:-}

services:
  db:
    # TimescaleDB with the latest Alpine security updates (db/Dockerfile).
    build: ./db
    image: market-data-platform-db:2.32.0-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Time for a clean shutdown (a checkpoint) before Docker kills it.
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits: {cpus: "2", memory: 2g}
    logging: *logging
    networks:
      - internal

  # Applies database migrations, the seed file, the private portfolio file and
  # the storage policies, and sets up the backend's and Grafana's database
  # roles, then exits. The backend and Grafana wait for it. It connects as the
  # database owner.
  migrate:
    build: ./backend
    command:
      - sh
      - -c
      - >-
        alembic upgrade head && python -m app.cli seed && python -m app.cli portfolio
        && python -m app.cli storage-policies
        && python -m app.cli app-role && python -m app.cli reader-role
    restart: "no"
    environment:
      <<: *backend-environment
      # Compression and retention of market observations and candles, in days.
      # Empty retention keeps everything.
      COMPRESS_AFTER_DAYS: ${COMPRESS_AFTER_DAYS-30}
      OBSERVATION_RETENTION_DAYS: ${OBSERVATION_RETENTION_DAYS:-}
      CANDLE_RETENTION_DAYS: ${CANDLE_RETENTION_DAYS:-}
      BACKEND_DB_USER: ${BACKEND_DB_USER:-marketdata_app}
      BACKEND_DB_PASSWORD: ${BACKEND_DB_PASSWORD:?set BACKEND_DB_PASSWORD in .env}
      GRAFANA_DB_USER: ${GRAFANA_DB_USER:-grafana_reader}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?set GRAFANA_DB_PASSWORD in .env}
    volumes:
      # Private holdings (PRD FR-016): portfolio/portfolio.toml, if present.
      - ${PORTFOLIO_DIR:-./portfolio}:/portfolio:ro
    depends_on:
      db:
        condition: service_healthy
    <<: *hardened
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits: {cpus: "1", memory: 1g}
    logging: *logging
    networks:
      - internal
      # `docker compose run migrate python -m app.cli collect ...` calls providers.
      - egress

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      <<: *backend-environment
      # The backend connects as its own role: read, insert, update; no deletes,
      # no schema changes (PRD section 6, Security).
      POSTGRES_USER: ${BACKEND_DB_USER:-marketdata_app}
      POSTGRES_PASSWORD: ${BACKEND_DB_PASSWORD:?set BACKEND_DB_PASSWORD in .env}
      # The backend runs the collection jobs on their schedules. Run one backend only.
      SCHEDULER_ENABLED: "true"
      # Enables POST /api/v1/collectors/{job}/run when set.
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Lets a running collection finish its current request.
    stop_grace_period: 30s
    <<: *hardened
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits: {cpus: "2", memory: 1g}
    logging: *logging
    networks:
      - internal
      - egress

  grafana:
    image: grafana/grafana:13.3.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      # Accounts are created by an administrator only; no anonymous access.
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # The data may not be redistributed (provider licences): no public or
      # external sharing of dashboards and snapshots.
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_PUBLIC_DASHBOARDS_ENABLED: "false"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      # No calls home.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      # Read by the datasource provisioning file.
      POSTGRES_DB: ${POSTGRES_DB}
      GRAFANA_DB_USER: ${GRAFANA_DB_USER:-grafana_reader}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?set GRAFANA_DB_PASSWORD in .env}
    volumes:
      - grafana_data:/var/lib/grafana
      # Datasources and dashboards come from version control.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana-dashboards:ro
    depends_on:
      db:
        condition: service_healthy
      # The read-only role must exist before Grafana connects.
      migrate:
        condition: service_completed_successfully
      prometheus:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    <<: *hardened
    deploy:
      resources:
        limits: {cpus: "1", memory: 1g}
    logging: *logging
    networks:
      - internal

  # Scrapes the backend's metrics and evaluates the alert rules (PRD FR-013).
  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus:/etc/prometheus:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    <<: *hardened
    read_only: true
    deploy:
      resources:
        limits: {cpus: "1", memory: 1g}
    logging: *logging
    networks:
      - internal

  # Groups and routes the alerts Prometheus sends. No notification channel is
  # configured by default; see docs/monitoring.md.
  alertmanager:
    image: prom/alertmanager:v0.34.2
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - alertmanager_data:/alertmanager
      - ./alertmanager:/etc/alertmanager:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9093/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    <<: *hardened
    read_only: true
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256m}
    logging: *logging
    networks:
      - internal
      # Notifications (email, webhooks) go out from here.
      - egress

  # Backs up the database every BACKUP_INTERVAL_HOURS into BACKUP_DIR and records
  # each run in the database_backup table (docs/deployment.md, "Backups").
  backup:
    # The server's image, so pg_dump matches the server.
    build: ./db
    image: market-data-platform-db:2.32.0-pg17
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup/loop.sh"]
    # The owner of BACKUP_DIR on the host.
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
    volumes:
      - ./backup:/backup:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    <<: *hardened
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits: {cpus: "1", memory: 512m}
    logging: *logging
    networks:
      - internal

volumes:
  db_data:
  grafana_data:
  prometheus_data:
  alertmanager_data:

networks:
  internal:
    internal: true
  egress:
