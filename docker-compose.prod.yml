# Production: used instead of docker-compose.override.yml, by setting in .env
#
#     COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml
#
# Adds the reverse proxy, the only published service. It terminates HTTPS
# (certificates from Let's Encrypt, renewed automatically) for DOMAIN and serves:
#
#   https://DOMAIN/auth/login   the login page (PRD FR-017)
#   https://DOMAIN/grafana/     Grafana (/ redirects there); the proxy asks the backend
#                               who is signed in and passes the user on to Grafana
#   https://DOMAIN/api/v1/...   the REST API, and /docs its documentation, for signed-in
#                               users and API tokens
#
# The database, Prometheus, Alertmanager and the backend's /metrics are not
# reachable from outside. See docs/deployment.md.

services:
  proxy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
      - "${PROXY_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      grafana:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:2019/config/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Binding ports 80 and 443 inside the container.
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits: {cpus: "1", memory: 256m}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      internal:
      egress:
      grafana_auth:
        # Grafana accepts the user headers from this address only.
        ipv4_address: ${AUTH_PROXY_ADDRESS:-172.31.254.2}

  backend:
    environment:
      # Served over HTTPS by the proxy: the session cookie is Secure.
      SESSION_COOKIE_SECURE: "true"
      HOME_PATH: /grafana/

  grafana:
    networks:
      internal:
      grafana_auth:
        # The proxy reaches Grafana by this name, on this network only, so its
        # requests come from AUTH_PROXY_ADDRESS. Both addresses are fixed, so
        # neither container can be handed the other's.
        ipv4_address: ${AUTH_GRAFANA_ADDRESS:-172.31.254.3}
        aliases:
          - grafana-auth
    environment:
      GF_SERVER_DOMAIN: ${DOMAIN}
      GF_SERVER_ROOT_URL: https://${DOMAIN}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_STRICT_TRANSPORT_SECURITY: "true"
      GF_SECURITY_STRICT_TRANSPORT_SECURITY_MAX_AGE_SECONDS: "31536000"
      # The platform's own accounts (PRD FR-017): the proxy passes the signed-in
      # user and role; Grafana creates the user on first visit and keeps its role
      # in step. Its own login form is off.
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_HEADERS: "Role:X-WEBAUTH-ROLE"
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_PROXY_WHITELIST: ${AUTH_PROXY_ADDRESS:-172.31.254.2}
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_SIGNOUT_REDIRECT_URL: https://${DOMAIN}/auth/logout
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/grafana/api/health || exit 1"]

networks:
  # Only the proxy and Grafana, with fixed addresses (see GF_AUTH_PROXY_WHITELIST).
  # Change AUTH_PROXY_SUBNET, AUTH_PROXY_ADDRESS and AUTH_GRAFANA_ADDRESS together
  # if the range is taken.
  grafana_auth:
    internal: true
    ipam:
      config:
        - subnet: ${AUTH_PROXY_SUBNET:-172.31.254.0/29}

volumes:
  caddy_data:
  caddy_config:
