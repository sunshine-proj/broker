# Alert rules (PRD FR-013). Each alert is explained in docs/monitoring.md.
# Test them with scripts/check_monitoring.sh.
groups:
  - name: platform
    rules:
      - alert: BackendDown
        expr: up{job="backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: The backend is not answering Prometheus.
          description: >-
            {{ $labels.instance }} has not been scraped for 2 minutes. Collection and the API
            are down, and every alert based on backend metrics is blind.

      - alert: DatabaseDown
        expr: marketdata_database_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: The backend cannot reach the database.
          description: >-
            The backend could not read the database for 1 minute. Collection fails and the
            API answers with errors.

      - alert: MonitoringTargetDown
        expr: up{job!="backend"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} is not answering Prometheus."
          description: "{{ $labels.instance }} has not been scraped for 5 minutes."

      - alert: ApiErrorRateHigh
        expr: >-
          sum(rate(marketdata_http_requests_total{status=~"5.."}[5m]))
            / sum(rate(marketdata_http_requests_total[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: More than 5 % of API requests are failing.
          description: >-
            {{ $value | humanizePercentage }} of API requests answered with a server error
            over the last 5 minutes.

  - name: collection
    rules:
      - alert: CollectorJobFailed
        expr: marketdata_job_failed == 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Job {{ $labels.job_name }} failed."
          description: >-
            The last run of {{ $labels.job_name }} ({{ $labels.kind }}) failed. Its error is on
            the Collection Failures dashboard and in `python -m app.cli jobs`.

      - alert: CollectorJobNotSucceeding
        expr: >-
          (time() - marketdata_job_last_success_timestamp_seconds{market_hours="false"})
            > (2 * marketdata_job_expected_interval_seconds{market_hours="false"} + 3600)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Job {{ $labels.job_name }} has not succeeded for a long time."
          description: >-
            {{ $labels.job_name }} last succeeded {{ $value | humanizeDuration }} ago, more
            than twice its interval plus an hour.

      - alert: ProviderDown
        expr: marketdata_provider_health_status == 2
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Provider {{ $labels.provider }} is down."
          description: >-
            Three or more calls to {{ $labels.provider }} failed in a row. Its last error is on
            the Provider Availability dashboard.

      - alert: ProviderDegraded
        expr: marketdata_provider_health_status == 1
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Provider {{ $labels.provider }} has been failing intermittently for an hour."
          description: "Calls to {{ $labels.provider }} keep failing now and then."

      - alert: ProviderRateLimited
        expr: increase(marketdata_provider_requests_total{outcome="rate_limited"}[1h]) > 3
        labels:
          severity: warning
        annotations:
          summary: "Provider {{ $labels.provider }} is rate limiting requests."
          description: >-
            {{ $labels.provider }} answered HTTP 429 {{ $value | humanize }} times in the last
            hour. Check its quota and the jobs' intervals.

      - alert: ProviderBudgetExhausted
        expr: increase(marketdata_provider_budget_refusals_total[1h]) > 0
        labels:
          severity: warning
        annotations:
          summary: "The rate budget of {{ $labels.provider }} ran out."
          description: >-
            The rate limiter refused requests to {{ $labels.provider }} in the last hour,
            normally because a daily or monthly quota is used up.

  - name: freshness
    rules:
      - alert: DataStale
        expr: marketdata_stale_series > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Data from {{ $labels.provider }} is stale."
          description: >-
            {{ $value }} series from {{ $labels.provider }} have nothing newer than their job
            allows. They are listed on the Data Quality dashboard.

  - name: backups
    rules:
      - alert: BackupFailed
        expr: marketdata_backup_last_failed == 1
        labels:
          severity: warning
        annotations:
          summary: The last database backup failed.
          description: >-
            The newest backup run failed; the backup service retries after an hour. Its error is
            in the database_backup table and `docker compose logs backup`.

      - alert: BackupMissing
        expr: >-
          (time() - marketdata_backup_last_success_timestamp_seconds)
            > (marketdata_backup_expected_interval_seconds + 6 * 3600)
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: No recent database backup.
          description: >-
            The last successful backup finished {{ $value | humanizeDuration }} ago, more than
            its interval plus six hours.

      - alert: BackupNeverRun
        expr: >-
          absent(marketdata_backup_last_success_timestamp_seconds)
            and on() marketdata_database_up == 1
        for: 2h
        labels:
          severity: critical
        annotations:
          summary: No database backup has ever succeeded.
          description: >-
            The database is up, but the backup service has not recorded a successful backup.
            Check `docker compose ps backup` and its log.
