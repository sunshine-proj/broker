# --- Binance ---------------------------------------------------------------------
# Public spot market data, no key. Binance limits request weight per IP
# address: 6,000 a minute (checked 2026-11-17). The limit below is a fifth of
# that, leaving room for anything else on the same address. Binance refuses
# some regions (HTTP 451); data-api.binance.vision serves the same market data
# and is used here. See docs/providers/binance.md.
#
# Budget: one ticker request (weight 2) a minute covers up to 20 pairs:
# 2,880 a day. Daily candles add 2 per pair.

[[providers]]
name = "binance"
base_url = "https://data-api.binance.vision/api/v3"

[providers.configuration]
rate_limits = [{ limit = 1200, period = "minute" }]
# Binance answers HTTP 429 with Retry-After; repeated violations get the
# address banned (HTTP 418), so retries are few and slow.
max_retries = 1
backoff_base_seconds = 10
backoff_max_seconds = 60

# Exchange-specific pairs: symbol is BASE/QUOTE and currency is the quote
# asset. Binance quotes against Tether (USDT), not US dollars, so these are
# separate instruments from the CoinGecko USD prices.

[[instruments]]
symbol = "BTC/USDT"
name = "Bitcoin / Tether on Binance"
asset_type = "crypto"
currency = "USDT"
metadata = { base = "BTC", quote = "USDT", venue = "Binance" }
providers = { binance = "BTC/USDT" }

[[instruments]]
symbol = "ETH/USDT"
name = "Ethereum / Tether on Binance"
asset_type = "crypto"
currency = "USDT"
metadata = { base = "ETH", quote = "USDT", venue = "Binance" }
providers = { binance = "ETH/USDT" }

[[instruments]]
symbol = "BNB/USDT"
name = "BNB / Tether on Binance"
asset_type = "crypto"
currency = "USDT"
metadata = { base = "BNB", quote = "USDT", venue = "Binance" }
providers = { binance = "BNB/USDT" }

[[instruments]]
symbol = "SOL/USDT"
name = "Solana / Tether on Binance"
asset_type = "crypto"
currency = "USDT"
metadata = { base = "SOL", quote = "USDT", venue = "Binance" }
providers = { binance = "SOL/USDT" }

[[instruments]]
symbol = "XRP/USDT"
name = "XRP / Tether on Binance"
asset_type = "crypto"
currency = "USDT"
metadata = { base = "XRP", quote = "USDT", venue = "Binance" }
providers = { binance = "XRP/USDT" }

# --- Federal Reserve Bank of New York ------------------------------------------------
# Markets Data API, no key. The reference rates the New York Fed administers,
# published each business day at 08:00 (SOFR) and 09:00 (EFFR, OBFR) New York
# time. No rate limit is published; this is a courtesy limit.
# Checked 2026-11-17. See docs/providers/nyfed.md, including its attribution.

[[providers]]
name = "nyfed"
base_url = "https://markets.newyorkfed.org/api"

[providers.configuration]
rate_limits = [{ limit = 30, period = "minute" }]
timeout_seconds = 20

[[instruments]]
symbol = "SOFR"
name = "Secured overnight financing rate"
asset_type = "interest_rate"
metadata = { country = "US", administrator = "Federal Reserve Bank of New York" }
providers = { nyfed = "SOFR" }

[[instruments]]
symbol = "OBFR"
name = "Overnight bank funding rate"
asset_type = "interest_rate"
metadata = { country = "US", administrator = "Federal Reserve Bank of New York" }
providers = { nyfed = "OBFR" }

# EFFR is listed with FRED above; the New York Fed is its source.

# --- US Department of the Treasury --------------------------------------------------
# Daily Treasury Par Yield Curve Rates, from the Treasury's public XML feed. No
# key; US government data in the public domain. Symbols are the feed's field
# names. No rate limit is published; this is a courtesy limit.
# Checked 2026-11-17. See docs/providers/us_treasury.md.

[[providers]]
name = "us_treasury"
base_url = "https://home.treasury.gov/resource-center/data-chart-center/interest-rates"

[providers.configuration]
rate_limits = [{ limit = 10, period = "minute" }]
# A year's feed takes about 20 seconds to arrive (measured 2026-11-17).
timeout_seconds = 60

# The 1-month to 30-year maturities shared with FRED are listed with FRED above.

[[instruments]]
symbol = "US6M"
name = "US Treasury 6-month yield"
asset_type = "government_bond_yield"
metadata = { country = "US", maturity = "6M", curve = "US Treasury", basis = "par yield, constant maturity" }
providers = { us_treasury = "BC_6MONTH" }

[[instruments]]
symbol = "US1Y"
name = "US Treasury 1-year yield"
asset_type = "government_bond_yield"
metadata = { country = "US", maturity = "1Y", curve = "US Treasury", basis = "par yield, constant maturity" }
providers = { us_treasury = "BC_1YEAR" }

[[instruments]]
symbol = "US3Y"
name = "US Treasury 3-year yield"
asset_type = "government_bond_yield"
metadata = { country = "US", maturity = "3Y", curve = "US Treasury", basis = "par yield, constant maturity" }
providers = { us_treasury = "BC_3YEAR" }

[[instruments]]
symbol = "US7Y"
name = "US Treasury 7-year yield"
asset_type = "government_bond_yield"
metadata = { country = "US", maturity = "7Y", curve = "US Treasury", basis = "par yield, constant maturity" }
providers = { us_treasury = "BC_7YEAR" }

[[instruments]]
symbol = "US20Y"
name = "US Treasury 20-year yield"
asset_type = "government_bond_yield"
metadata = { country = "US", maturity = "20Y", curve = "US Treasury", basis = "par yield, constant maturity" }
providers = { us_treasury = "BC_20YEAR" }

# --- Collection jobs ---------------------------------------------------------------
# Times are UTC. Budgets (per provider sections above):
#   Twelve Data: 14 listed x 27 polls (09:30 to 16:00 New York, both ends)
#                + 5 forex x 48 polls + 1 gold x 48 polls
#                + 20 candles x 2 (with retry) + 5 backfill = 711 of 800 a day.
#   CoinGecko:   288 market polls + 12 dominance polls x 2 requests + 5 backfill
#                = 317 a day, 9,827 in a 31-day month, of 10,000.

[[jobs]]
name = "twelve_data_listed_quotes"
provider = "twelve_data"
kind = "quotes"
asset_types = ["stock", "etf"]
interval_minutes = 15
market_hours_only = true

[[jobs]]
name = "twelve_data_forex_quotes"
provider = "twelve_data"
kind = "quotes"
asset_types = ["forex"]
interval_minutes = 30
# Forex closes from Friday 22:00 to Sunday 21:00 UTC.
business_days_only = true
stale_after_minutes = 240
gap_after_minutes = 240

[[jobs]]
name = "twelve_data_commodity_quotes"
provider = "twelve_data"
kind = "quotes"
asset_types = ["commodity"]
interval_minutes = 30
business_days_only = true
stale_after_minutes = 240
gap_after_minutes = 240

# Daily bars are dated at midnight UTC and closed 24 hours later. 00:40 keeps
# the run clear of the quote jobs at 00:30 and 01:00.
[[jobs]]
name = "twelve_data_daily_candles"
provider = "twelve_data"
kind = "candles"
candle_interval = "1day"
lookback_days = 5
daily_at = "00:40"
retry_minutes = 60
# No bars at weekends for stocks; exchange holidays show up as gaps that
# backfill closes as no_data.
business_days_only = true

[[jobs]]
name = "coingecko_quotes"
provider = "coingecko"
kind = "quotes"
observation_types = ["price", "market_cap", "volume", "circulating_supply", "total_supply"]
interval_minutes = 5
gap_after_minutes = 30

[[jobs]]
name = "coingecko_dominance"
provider = "coingecko"
kind = "quotes"
observation_types = ["dominance"]
interval_minutes = 120

# Reference rates are published around 16:00 CET; €STR at 08:00 CET.
[[jobs]]
name = "ecb_daily_quotes"
provider = "ecb"
kind = "quotes"
daily_at = "16:00"
retry_minutes = 60
# Published on TARGET business days; key rates only when they change.
business_days_only = true
gap_after_minutes = 1440

[[jobs]]
name = "ecb_indicators"
provider = "ecb"
kind = "indicators"
lookback_days = 730
daily_at = "10:00"
retry_minutes = 60

# Exchange prices every minute. Volume comes with the daily candles.
[[jobs]]
name = "binance_quotes"
provider = "binance"
kind = "quotes"
observation_types = ["price"]
interval_minutes = 1
gap_after_minutes = 5

[[jobs]]
name = "binance_daily_candles"
provider = "binance"
kind = "candles"
candle_interval = "1day"
lookback_days = 5
daily_at = "00:10"
retry_minutes = 30

# SOFR is published at 08:00 and EFFR and OBFR at 09:00 New York time, and may
# be revised the same day at about 14:30 (18:30 or 19:30 UTC). Stored values are
# immutable, so collect after the revision window.
[[jobs]]
name = "nyfed_quotes"
provider = "nyfed"
kind = "quotes"
daily_at = "20:30"
retry_minutes = 60
business_days_only = true
gap_after_minutes = 1440

# The Treasury posts the day's curve in the late afternoon, New York time.
[[jobs]]
name = "us_treasury_quotes"
provider = "us_treasury"
kind = "quotes"
daily_at = "23:30"
retry_minutes = 60
business_days_only = true
gap_after_minutes = 1440

# FRED jobs are disabled until FRED_API_KEY is set and its terms of use are
# settled (see docs/providers/fred.md).
[[jobs]]
name = "fred_daily_quotes"
provider = "fred"
kind = "quotes"
daily_at = "22:00"
retry_minutes = 60
enabled = false

[[jobs]]
name = "fred_indicators"
provider = "fred"
kind = "indicators"
lookback_days = 730
daily_at = "14:00"
retry_minutes = 60
enabled = false

# --- Data quality (PRD FR-012) ---------------------------------------------------------
# Checks every job's data for stale series, gaps, spikes and provider
# discrepancies. Reads the database only; no provider is called.
[[jobs]]
name = "data_quality_check"
kind = "quality"
interval_minutes = 15
# How far back gaps are looked for.
lookback_days = 30

# Backfill re-fetches gaps the checks found, a few requests a day per
# provider, counted in each provider's budget. Binance quotes have no history,
# so their gaps are closed as unrecoverable; Binance candle gaps are filled.
[[jobs]]
name = "twelve_data_backfill"
provider = "twelve_data"
kind = "backfill"
daily_at = "03:10"
max_requests = 5

[[jobs]]
name = "coingecko_backfill"
provider = "coingecko"
kind = "backfill"
daily_at = "03:20"
max_requests = 5

[[jobs]]
name = "binance_backfill"
provider = "binance"
kind = "backfill"
daily_at = "03:30"
max_requests = 10

[[jobs]]
name = "ecb_backfill"
provider = "ecb"
kind = "backfill"
daily_at = "03:40"
max_requests = 10

[[jobs]]
name = "nyfed_backfill"
provider = "nyfed"
kind = "backfill"
daily_at = "03:50"
max_requests = 5

# Each request downloads a year of the curve (about 20 seconds).
[[jobs]]
name = "us_treasury_backfill"
provider = "us_treasury"
kind = "backfill"
daily_at = "04:00"
max_requests = 3
