# --- European Central Bank --------------------------------------------------------
# ECB Data Portal (SDMX). No key. Symbols and series codes are
# <dataflow>/<series key>; series can be browsed at https://data.ecb.europa.eu.
# Checked 2026-11-16. See docs/providers/ecb.md.
#
# Quotes are supported for the EXR (exchange rates), EST (€STR) and FM
# (key interest rates) dataflows; other dataflows are economic indicators.
# Collection needs a handful of requests a day.

[[providers]]
name = "ecb"
base_url = "https://data-api.ecb.europa.eu/service"

[providers.configuration]
# The ECB publishes no rate limit; this is a courtesy limit, far above what
# collection needs.
rate_limits = [{ limit = 30, period = "minute" }]
timeout_seconds = 30

