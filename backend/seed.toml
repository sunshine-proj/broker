# --- Collection jobs ---------------------------------------------------------------
# Times are UTC. Budgets (per provider sections above):
#   Twelve Data: 10 listed x 27 polls (09:30 to 16:00 New York, both ends)
#                + 5 forex x 96 polls + 15 candles x 2 (with retry) = 780 of 800 a day.
#   CoinGecko:   288 market polls + 12 dominance polls x 2 requests = 312 a day,
#                9,672 in a 31-day month, of 10,000.

[[jobs]]
name = "twelve_data_listed_quotes"
provider = "twelve_data"
kind = "quotes"
asset_types = ["stock", "etf"]
interval_minutes = 15
market_hours_only = true

[[jobs]]
name = "twelve_data_forex_quotes"
provider = "twelve_data"
kind = "quotes"
asset_types = ["forex"]
interval_minutes = 15

# Daily bars are dated at midnight UTC and closed 24 hours later.
[[jobs]]
name = "twelve_data_daily_candles"
provider = "twelve_data"
kind = "candles"
candle_interval = "1day"
lookback_days = 5
daily_at = "00:30"
retry_minutes = 60

[[jobs]]
name = "coingecko_quotes"
provider = "coingecko"
kind = "quotes"
observation_types = ["price", "market_cap", "volume", "circulating_supply", "total_supply"]
interval_minutes = 5

[[jobs]]
name = "coingecko_dominance"
provider = "coingecko"
kind = "quotes"
observation_types = ["dominance"]
interval_minutes = 120

# Reference rates are published around 16:00 CET; €STR at 08:00 CET.
[[jobs]]
name = "ecb_daily_quotes"
provider = "ecb"
kind = "quotes"
daily_at = "16:00"
retry_minutes = 60

[[jobs]]
name = "ecb_indicators"
provider = "ecb"
kind = "indicators"
lookback_days = 730
daily_at = "10:00"
retry_minutes = 60

# FRED jobs are disabled until FRED_API_KEY is set and its terms of use are
# settled (see docs/providers/fred.md).
[[jobs]]
name = "fred_daily_quotes"
provider = "fred"
kind = "quotes"
daily_at = "22:00"
retry_minutes = 60
enabled = false

[[jobs]]
name = "fred_indicators"
provider = "fred"
kind = "indicators"
lookback_days = 730
daily_at = "14:00"
retry_minutes = 60
enabled = false
