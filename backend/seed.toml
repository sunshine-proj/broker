# --- Twelve Data ---------------------------------------------------------------
# Limits are those of the free Basic plan, checked 2026-11-16: 8 credits per
# minute, restored on the minute, and 800 per day, restored at midnight UTC.
# One credit per symbol. See docs/providers/twelve_data.md.
#
# Budget (PRD section 8): 14 stocks and ETFs polled every 15 minutes over a
# 6.5-hour session, 5 forex pairs and gold polled every 30 minutes around the
# clock, and one daily candle per instrument: 706 of 800 a day (see the jobs
# section). Adding instruments needs a longer interval or a paid plan.
#
# The free plan covers US listings only, no market indices, and of the
# commodities only gold (XAU/USD); silver, oil and natural gas need the Grow
# plan (checked 2026-11-17).

[[providers]]
name = "twelve_data"
base_url = "https://api.twelvedata.com"

[providers.configuration]
rate_limits = [
    { limit = 8, period = "minute", resets_on_boundary = true },
    { limit = 800, period = "day", resets_on_boundary = true },
]
# One credit per symbol, so a request can carry at most a minute's worth.
max_batch_size = 8
# At :00 and :30 the listed, forex and gold jobs together need 20 credits,
# which take three minutes at 8 a minute; the last request must not be refused.
rate_limit_max_wait_seconds = 190
# A rejected request still uses a credit, so after HTTP 429 the client waits
# for the next minute (up to 61 seconds) instead of retrying early.
max_retries = 2
backoff_base_seconds = 15
backoff_max_seconds = 65
auth = { type = "header", name = "Authorization", prefix = "apikey ", env = "TWELVEDATA_API_KEY" }

