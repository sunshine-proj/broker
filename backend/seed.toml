# --- CoinGecko -----------------------------------------------------------------
# Works without a key (keyless public API, about 5 calls a minute, shared by
# everyone on the same IP address) and with a free Demo key (100 a minute,
# 10,000 successful calls a month, counted per calendar month). The limits
# below suit both; with a Demo key the per-minute limit may be raised.
# Checked 2026-11-16. See docs/providers/coingecko.md.
#
# Budget: one quote request covers every coin (up to 250). Polled every
# 5 minutes that is 8,640 calls a month; dominance hourly adds 720 and a daily
# history refresh of 10 coins adds 300: 9,660 of 10,000.

[[providers]]
name = "coingecko"
base_url = "https://api.coingecko.com/api/v3"

[providers.configuration]
rate_limits = [
    { limit = 5, period = "minute" },
    { limit = 10000, period = "month", resets_on_boundary = true },
]
# The keyless API asks for 60 seconds after HTTP 429 (Retry-After).
rate_limit_max_wait_seconds = 65
max_retries = 2
backoff_base_seconds = 15
backoff_max_seconds = 65
auth = { type = "header", name = "x-cg-demo-api-key", env = "COINGECKO_API_KEY", optional = true }

