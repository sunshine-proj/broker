# --- FRED (Federal Reserve Bank of St. Louis) -------------------------------------
# Needs a free API key in FRED_API_KEY. Symbols and series codes are FRED series
# ids; find them with `python -m app.cli search fred QUERY`. FRED allows 120
# requests a minute; collection needs one request per series.
# Checked 2026-11-16. See docs/providers/fred.md, including its licensing section.

[[providers]]
name = "fred"
base_url = "https://api.stlouisfed.org/fred"

[providers.configuration]
rate_limits = [{ limit = 100, period = "minute" }]
backoff_base_seconds = 5
backoff_max_seconds = 60
auth = { type = "query", name = "api_key", env = "FRED_API_KEY" }

